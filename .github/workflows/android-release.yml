name: Android production release

# Deliberate production builds only — not on ordinary pushes.
on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Create GitHub Release after a successful signed build"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. v1.0.1). Required when create_github_release is true."
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-production-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.7"
  JAVA_VERSION: "17"
  EXPECTED_APPLICATION_ID: "com.sahayasavari.slivault"
  EXPECTED_SIGNER_CN: "CN=Sahaya Savari F"

jobs:
  build-signed:
    name: Analyze, test, and signed release build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refuse to build a debug-signed production artifact. Configure the four ANDROID_* secrets and re-run."
            exit 1
          fi
          echo "All required signing secrets are present (values not printed)."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Android SDK packages
        run: |
          set -euo pipefail
          # GitHub-hosted runners already ship an Android SDK; avoid obsolete `tools` package.
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-}}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME / ANDROID_SDK_ROOT is not set on the runner"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.0" "platforms;android-35"
          echo "SDK packages installed via $SDKMANAGER"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Automated tests
        run: flutter test

      - name: Materialize release keystore (ephemeral)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/sli-vault-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=${KEYSTORE_PATH}"
          } > android/key.properties
          # Never echo secret values.
          echo "Wrote ephemeral android/key.properties (storeFile under RUNNER_TEMP)."

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Build signed release App Bundle
        run: flutter build appbundle --release

      - name: Verify package identity and signature
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"

          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT_BIN="$(find "$SDKROOT" -path '*/build-tools/*/aapt' -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          APKSIGNER="$(find "$SDKROOT" -path '*/build-tools/*/apksigner' -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$AAPT_BIN" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::Android build-tools (aapt/apksigner) not found under SDK"
            exit 1
          fi

          PACKAGE_LINE="$("$AAPT_BIN" dump badging "$APK" | head -n 1)"
          echo "Package line: $PACKAGE_LINE"
          echo "$PACKAGE_LINE" | grep -F "name='${EXPECTED_APPLICATION_ID}'"
          echo "$PACKAGE_LINE" | grep -F "versionName='1.0.1'"
          echo "$PACKAGE_LINE" | grep -F "versionCode='2'"

          CERT_OUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          echo "$CERT_OUT" | grep -F "$EXPECTED_SIGNER_CN"
          if echo "$CERT_OUT" | grep -qi 'Android Debug'; then
            echo "::error::APK is signed with Android Debug certificate"
            exit 1
          fi
          "$APKSIGNER" verify "$APK"
          echo "Signature verification passed for expected owner certificate CN."

      - name: Stage versioned artifacts
        id: stage
        run: |
          set -euo pipefail
          VERSION_LINE="$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          OUT="dist"
          mkdir -p "$OUT"
          APK_NAME="sli-vault-${VERSION_NAME}-release.apk"
          AAB_NAME="sli-vault-${VERSION_NAME}-release.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT/$APK_NAME"
          cp build/app/outputs/bundle/release/app-release.aab "$OUT/$AAB_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "Staged $APK_NAME and $AAB_NAME (versionCode=$VERSION_CODE)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sli-vault-${{ steps.stage.outputs.version_name }}-android
          path: |
            dist/${{ steps.stage.outputs.apk_name }}
            dist/${{ steps.stage.outputs.aab_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.create_github_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::release_tag is required when create_github_release is true"
            exit 1
          fi
          VERSION_NAME="${{ steps.stage.outputs.version_name }}"
          VERSION_CODE="${{ steps.stage.outputs.version_code }}"
          APK="dist/${{ steps.stage.outputs.apk_name }}"
          AAB="dist/${{ steps.stage.outputs.aab_name }}"
          NOTES="$(cat <<EOF
          ## SLI Vault ${VERSION_NAME}

          Production Android sideload package (not Play Store).

          - Application ID: \`${EXPECTED_APPLICATION_ID}\`
          - versionName: \`${VERSION_NAME}\`
          - versionCode: \`${VERSION_CODE}\`
          - Signing: owner release keystore (\`${EXPECTED_SIGNER_CN}\`)
          - \`FLAG_SECURE\`: enabled (screenshots / screen recording / recent-apps previews of the app window are blocked on supporting devices)

          Physical-device QA checklist items remain largely **NOT TESTED**.
          EOF
          )"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists — refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG" "$APK" "$AAB" \
            --repo "${{ github.repository }}" \
            --title "SLI Vault ${VERSION_NAME}" \
            --notes "$NOTES"

      - name: Scrub ephemeral signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "${RUNNER_TEMP}/sli-vault-release.jks" || true
