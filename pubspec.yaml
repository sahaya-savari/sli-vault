name: sli_vault
description: "SLI Vault — Privacy-first, local-first personal vault to save links, screenshots, and images."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  file_picker: 10.3.10
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  archive: ^4.0.4
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/android/
    - assets/illustrations/
    - assets/tokens/
    - assets/icons/navigation/
    - assets/icons/content/
    - assets/icons/actions/
    - assets/icons/utility/
    - assets/icons/status/
