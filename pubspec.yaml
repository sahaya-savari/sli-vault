name: sli_vault
description: "SLI Vault — Privacy-first, local-first personal vault to save links, screenshots, and images."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  file_picker: 10.3.10
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  archive: ^4.0.4
  crypto: ^3.0.7
  local_auth: ^2.3.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/android/
    - assets/illustrations/
    - assets/illustrations/loading/
    - assets/illustrations/onboarding/
    - assets/tokens/
    - assets/icons/navigation/
    - assets/icons/content/
    - assets/icons/actions/
    - assets/icons/utility/
    - assets/icons/status/

  fonts:
    # Primary UI — Anthropic Serif (MB Claude Font pack, Text optical size)
    - family: Claude
      fonts:
        - asset: assets/fonts/claude/AnthropicSerif-Text-Regular-Static.otf
          weight: 400
        - asset: assets/fonts/claude/AnthropicSerif-Text-RegularItalic-Static.otf
          weight: 400
          style: italic
        - asset: assets/fonts/claude/AnthropicSerif-Text-Medium-Static.otf
          weight: 500
        - asset: assets/fonts/claude/AnthropicSerif-Text-MediumItalic-Static.otf
          weight: 500
          style: italic
        - asset: assets/fonts/claude/AnthropicSerif-Text-Semibold-Static.otf
          weight: 600
        - asset: assets/fonts/claude/AnthropicSerif-Text-SemiboldItalic-Static.otf
          weight: 600
          style: italic
        - asset: assets/fonts/claude/AnthropicSerif-Text-Bold-Static.otf
          weight: 700
        - asset: assets/fonts/claude/AnthropicSerif-Text-BoldItalic-Static.otf
          weight: 700
          style: italic
    # Display optical size for large titles / hero headings
    - family: ClaudeDisplay
      fonts:
        - asset: assets/fonts/claude/AnthropicSerif-Display-Regular-Static.otf
          weight: 400
        - asset: assets/fonts/claude/AnthropicSerif-Display-Medium-Static.otf
          weight: 500
        - asset: assets/fonts/claude/AnthropicSerif-Display-Semibold-Static.otf
          weight: 600
        - asset: assets/fonts/claude/AnthropicSerif-Display-Bold-Static.otf
          weight: 700
    # Secondary / technical mono (JetBrains Mono, OFL-1.1)
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
