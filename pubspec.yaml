name: sli_vault
description: "SLI Vault - Privacy-first, local-first personal vault to save links, screenshots, and images."
publish_to: 'none'
version: 1.0.1+2009

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  file_picker: 10.3.10
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  archive: ^4.0.4
  crypto: ^3.0.7
  local_auth: ^2.3.0
  video_player: ^2.14.1
  sqflite_common_ffi: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/android/
    - assets/illustrations/
    - assets/illustrations/loading/
    - assets/illustrations/onboarding/
    - assets/tokens/
    - assets/icons/navigation/
    - assets/icons/content/
    - assets/icons/actions/
    - assets/icons/utility/
    - assets/icons/status/

  fonts:
    # Primary UI - Figtree (SIL Open Font License 1.1)
    - family: Figtree
      fonts:
        - asset: assets/fonts/figtree/Figtree-Light.ttf
          weight: 300
        - asset: assets/fonts/figtree/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/figtree/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/figtree/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/figtree/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/figtree/Figtree-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/figtree/Figtree-Black.ttf
          weight: 900
    # Expressive Display & Title - Google Sans Flex (SIL Open Font License 1.1)
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/google_sans_flex/GoogleSansFlex.ttf
    # Secondary / technical mono - JetBrains Mono (SIL Open Font License 1.1)
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
